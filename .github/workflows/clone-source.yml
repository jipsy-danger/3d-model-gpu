name: Clone source repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clone:
    if: contains(github.event.head_commit.message, '[clone-source]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source
        run: |
          git clone --depth 1 --branch main https://github.com/jipsy-danger/3d-model.git /tmp/source
          rsync -a --delete --exclude='.git' /tmp/source/ ./
          rm -f .github/workflows/clone-source.yml

      - name: Commit exact clone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clone 3d-model into GPU repository [skip ci]" || exit 0
          git push origin HEAD:main
